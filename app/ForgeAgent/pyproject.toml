[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-agent"
version = "0.1.0"
description = "Forge AgentCore Runtime application"
requires-python = ">=3.10"
dependencies = [
  "aws-opentelemetry-distro",
  "boto3>=1.35.0",
  "bedrock-agentcore>=1.9.1",
  "botocore[crt]>=1.35.0",
  "strands-agents>=1.15.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]
