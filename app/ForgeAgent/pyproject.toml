[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-agent"
version = "0.1.0"
description = "Forge AgentCore Runtime application"
requires-python = ">=3.11"
dependencies = [
  "aws-opentelemetry-distro",
  "openai>=1.68.0",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
  "boto3>=1.35.0",
  "bedrock-agentcore>=1.9.1",
  "botocore[crt]>=1.35.0",
  "strands-agents>=1.55.1",
  "nflmeta==0.1.6"
]

[tool.hatch.build.targets.wheel]
packages = ["."]
