[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bee-agent"
version = "0.1.0"
description = "Y public website Bee agent: AgentCore runtime with pairing + beeplex tools"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "bedrock-agentcore>=1.9.1",
  "strands-agents>=1.55.1",
  "python-dotenv>=1.0.0",
  "mcp>=2,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
]
