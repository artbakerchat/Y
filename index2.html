<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Search</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
    }

    * { box-sizing: border-box; }

    body {
      display: block;
      min-height: 100vh;
      margin: 0;
      padding: 24px 0 48px;
      background: #fff;
      overflow-y: auto;
    }

    main {
      width: min(92vw, 640px);
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0;
      margin: 0 0 28px;
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 400;
      letter-spacing: normal;
    }

    h1 span {
      display: inline-block;
      transition: transform 250ms ease, margin 250ms ease;
    }

    .running-machine-card {
      position: relative;
      overflow: hidden;
      margin: 0 0 28px;
      padding: 1.2rem 1.3rem 4rem;
      border: 1px solid #b9d8d1;
      border-radius: 1rem;
      color: #173c39;
      background: linear-gradient(105deg, #dceee9, #f7efe1 72%);
      box-shadow: 0 0.6rem 1.25rem rgb(38 64 61 / 8%);
      text-align: left;
    }

    .prompt-button {
      z-index: 3;
      color: #8ea1b4;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
    }

    .prompt-button:hover { color: #1f2937; }
    .prompt-button:focus-visible { outline: 2px solid #8ea1b4; outline-offset: 3px; }

    .top-buttons { position: absolute; top: 1rem; right: 1rem; z-index: 3; display: flex; flex-direction: column; align-items: stretch; gap: 0.4rem; }
    .pricing-button { color: #8ea1b4; font: inherit; font-size: 13px; text-align: center; text-decoration: none; }
    .pricing-button:hover { color: #1f2937; }
    .pricing-button:focus-visible { outline: 2px solid #8ea1b4; outline-offset: 3px; }

    .running-machine-card__copy { position: relative; z-index: 2; padding-right: 5rem; }

    .running-machine-card__eyebrow {
      margin: 0 0 0.35rem;
      color: #58746d;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .running-machine-card h2 {
      margin: 0 0 0.45rem;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
    }

    .running-machine-card p:last-child {
      max-width: 28rem;
      margin: 0;
      color: #52605e;
      line-height: 1.45;
    }

    .running-machine-card__track {
      position: absolute;
      right: 1.3rem;
      bottom: 1.05rem;
      left: 1.3rem;
      z-index: 1;
      height: 1.55rem;
      overflow: hidden;
      border: 0.3rem solid #273f41;
      border-radius: 1rem;
      background: repeating-linear-gradient(100deg, #486361 0 1rem, #78918b 1rem 2rem);
    }

    .running-machine-card__belt {
      display: block;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(100deg, transparent 0 1rem, rgb(255 255 255 / 35%) 1rem 1.15rem);
      animation: running-machine-belt 700ms linear infinite;
    }

    .running-machine-card__words {
      position: absolute;
      inset: 0;
      padding: 0 0.55rem;
      color: #f8fffc;
      font-size: 0.62rem;
      font-weight: 800;
      text-shadow: 0 1px 1px rgb(23 60 57 / 70%);
      white-space: nowrap;
    }

    .running-machine-card__words span {
      position: absolute;
      top: 50%;
      left: -20%;
      max-width: 33%;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateY(-50%);
      animation: treadmill-word 6s linear infinite;
    }

    .running-machine-card__words span:nth-child(2) { animation-delay: 2s; }
    .running-machine-card__words span:nth-child(3) { animation-delay: 4s; }

    .running-machine-card__arrival {
      position: absolute;
      right: 12%;
      bottom: 0.2rem;
      z-index: 2;
      pointer-events: none;
    }

    .running-machine-card__shoe {
      display: inline-block;
      margin-left: -0.65rem;
      font-size: clamp(2.2rem, 7vw, 4rem);
      filter: drop-shadow(0 0.55rem 0.7rem rgb(53 89 216 / 18%));
      opacity: 0;
      animation: running-machine-shoe 1.8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .running-machine-card__shoe--one { animation-delay: 0.05s; }
    .running-machine-card__shoe--two { animation-delay: 0.28s; }
    .running-machine-card__shoe--three { animation-delay: 0.51s; }

    @keyframes running-machine-belt { to { transform: translateX(2rem); } }

    @keyframes treadmill-word {
      from { left: -20%; }
      to { left: 100%; }
    }

    @keyframes running-machine-shoe {
      0% { opacity: 0; transform: translateX(-5rem) rotate(-16deg) scale(.72); }
      22% { opacity: 1; }
      72% { opacity: .92; }
      100% { opacity: .18; transform: translateX(5rem) rotate(12deg) scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      .running-machine-card__belt,
      .running-machine-card__shoe { animation: none; opacity: 0.18; }
      .running-machine-card__words span { animation: none; left: 50%; }
    }

    @media (max-width: 520px) {
      body { padding: 16px 12px 40px; }
      main { width: 100%; margin: 0 auto; }
      h1 { font-size: clamp(3rem, 18vw, 4.5rem); }
      .running-machine-card { padding: 1rem 1rem 4rem; }
      .top-buttons { top: 0.8rem; right: 0.8rem; }
      .prompt-button, .pricing-button { font-size: 12px; }
      .running-machine-card__copy { padding-right: 4.8rem; }
      .running-machine-card__track { right: 1rem; left: 1rem; }
      form { padding-left: 14px; }
    }

    form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 7px 5px 18px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      box-shadow: 0 1px 6px rgb(32 33 36 / 18%);
      transition: box-shadow 150ms ease;
    }

    form:focus-within {
      box-shadow: 0 2px 8px rgb(32 33 36 / 24%);
    }

    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      font-size: 16px;
      color: #202124;
    }

    input::placeholder { color: #9aa0a6; }

    #result {
      min-height: 24px;
      margin: 24px 0 0;
      color: #5f6368;
      font-size: 15px;
    }

    .word-garden { margin: 28px 0 0; padding: 1rem; border: 1px solid #e5ddff; border-radius: 16px; background: #f8f5ff; text-align: left; }
    .word-garden__heading { display: flex; justify-content: space-between; gap: 1rem; align-items: start; }
    .word-garden__eyebrow { margin: 0 0 0.3rem; color: #7557b8; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .word-garden h2 { margin: 0; color: #202124; font-size: clamp(1.25rem, 5vw, 1.8rem); }
    .word-garden__clear { padding: 0; border: 0; color: #5e4594; background: transparent; cursor: pointer; font: inherit; font-size: 0.72rem; font-weight: 700; }
    .word-garden__clear:hover { color: #7557b8; text-decoration: underline; }
    .word-garden__clear:focus-visible { outline: 2px solid #8d6bd1; outline-offset: 3px; }
    .word-palette { margin: 1rem 0; padding: 0.8rem 0.9rem; border: 1px solid #e5ddff; border-radius: 10px; background: #fff; }
    .word-palette h3 { margin: 0; color: #7557b8; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .word-palette ul { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.65rem 0 0; padding: 0; list-style: none; }
    .word-palette li { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.55rem; color: #4b3d68; background: #f1edff; border-radius: 6px; font-size: 1.64rem; cursor: grab; }
    .word-palette li.is-dragging { opacity: 0.45; }
    .word-palette__remove { padding: 0; color: #7557b8; background: transparent; border: 0; cursor: pointer; font: inherit; font-size: 1rem; line-height: 0.8; }
    .word-palette__remove:hover { color: #b42318; }
    @media (max-width: 520px) { .word-garden { padding: 0.8rem; } }
    @media (max-width: 360px) { .word-garden__heading { display: block; } }
  </style>
</head>
<body>
  <main>
    <h1 id="running-word-title" aria-label="Current treadmill word"></h1>
    <section class="running-machine-card" aria-labelledby="running-machine-title">
      <nav class="top-buttons" aria-label="Site navigation">
        <a class="prompt-button" href="prompt.html">Prompt</a>
      </nav>
      <div class="running-machine-card__copy">
        <p class="running-machine-card__eyebrow">A moving pause</p>
        <h2 id="running-machine-title">Running Machine</h2>
        <p>Take a steady route through your top three words.</p>
      </div>
      <div class="running-machine-card__track" aria-label="Top three palette words">
        <span class="running-machine-card__belt" aria-hidden="true"></span>
        <span class="running-machine-card__words">
          <span>river</span><span>bright</span><span>under</span>
        </span>
      </div>
      <span class="running-machine-card__arrival" aria-hidden="true">
        <span class="running-machine-card__shoe running-machine-card__shoe--one">👟</span>
        <span class="running-machine-card__shoe running-machine-card__shoe--two">🥾</span>
        <span class="running-machine-card__shoe running-machine-card__shoe--three">👟</span>
      </span>
    </section>
    <form id="search-form">
      <label for="search-input" hidden>Search</label>
      <input id="search-input" name="q" type="search" autocomplete="off" autofocus placeholder="Type three words and press enter">
    </form>
    <section class="word-garden" aria-label="Word garden">
      <div class="word-garden__heading">
        <div><p class="word-garden__eyebrow">Word garden</p><h2>Word palette</h2></div>
        <button class="word-garden__clear" id="clear-garden-button" type="button">Clear</button>
      </div>
      <div class="word-palette" aria-labelledby="word-palette-title">
        <h3 id="word-palette-title">Word palette</h3>
        <ul id="word-list"></ul>
      </div>
    </section>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    const form = document.querySelector('#search-form');
    const input = document.querySelector('#search-input');
    const result = document.querySelector('#result');
    const runningWordTitle = document.querySelector('#running-word-title');
    const treadmillTrack = document.querySelector('.running-machine-card__track');
    const speakInputStorageKey = 'speak-input';

    try {
      input.value = localStorage.getItem(speakInputStorageKey) || '';
    } catch {
      // Storage is optional; the input still works without it.
    }

    function saveSpeakInput() {
      try { localStorage.setItem(speakInputStorageKey, input.value); } catch { /* Storage is optional. */ }
    }
    const treadmillWords = document.querySelectorAll('.running-machine-card__words span');
    const wordList = document.querySelector('#word-list');
    const clearGardenButton = document.querySelector('#clear-garden-button');
    const defaultGardenWords = ['anchor', 'pinnacle', 'summit', 'twilight', 'static', 'ocean', 'wander', 'spark', 'gravity', 'money', 'book', 'Glimmer', 'compass', 'voyage', 'solitude', 'prism', 'nectar', 'blossom', 'fossil', 'zenith', 'vortex', 'mirage', 'starlight', 'ember', 'cyclone', 'glacier', 'radiance', 'labyrinth', 'aurora', 'thistle', 'apple', 'Nebula', 'crisp', 'whisper', 'avalanche', 'horizon', 'velvet', 'mosaic', 'thunder', 'marble', 'cascade', 'echo', 'lantern', 'silver', 'standard', 'puzzle', 'orbit', 'shadow', 'flicker', 'autumn', 'rhythm', 'canvas'];
    let gardenWords = [...defaultGardenWords];
    let draggedGardenItem = null;
    const previousWordCenters = new Map();
    const titleColors = ['#4285f4', '#ea4335', '#fbbc05', '#4285f4', '#34a853', '#ea4335'];

    function getGardenWords() {
      try {
        const gardenWords = JSON.parse(localStorage.getItem('garden-words') || 'null');
        return Array.isArray(gardenWords) && gardenWords.length ? gardenWords : defaultGardenWords;
      } catch {
        return defaultGardenWords;
      }
    }

    function syncGardenWords() {
      const gardenWords = getGardenWords();
      treadmillWords.forEach((word, index) => {
        word.textContent = gardenWords[index] || '';
      });
    }

    function addSearchWordsToGarden(query) {
      const additions = query.includes('|')
        ? [...new Set(query.split('|').map((word) => word.trim()).filter((word) => word && word.length <= 32))].slice(0, 52)
        : (() => {
          const words = query.split(/\s+/).filter(Boolean).slice(0, 3);
          return words.length && words.every((word) => word.length <= 32)
            ? [words.join(' ')]
            : [];
        })();
      let updatedGardenWords = [...getGardenWords()];

      try {
        const savedWords = JSON.parse(localStorage.getItem('garden-words') || 'null');
        if (Array.isArray(savedWords) && savedWords.length) updatedGardenWords = savedWords;
        const newWords = additions.filter((word, index) => (
          !updatedGardenWords.includes(word) && additions.indexOf(word) === index
        ));
        gardenWords = [...newWords, ...updatedGardenWords].slice(0, 52);
        localStorage.setItem('garden-words', JSON.stringify(gardenWords));
        syncGardenWords();
        renderGardenPalette();
        renderGardenBeats();
      } catch {
        // Storage is optional; the search still works without it.
      }
    }

    function saveGardenWords() {
      try { localStorage.setItem('garden-words', JSON.stringify(gardenWords)); } catch { /* Storage is optional. */ }
    }

    function removeWordFromPrompt(word) {
      try {
        const savedPromptWords = JSON.parse(localStorage.getItem('prompt-words') || 'null');
        if (Array.isArray(savedPromptWords)) localStorage.setItem('prompt-words', JSON.stringify(savedPromptWords.filter((promptWord) => promptWord !== word)));
      } catch { /* Storage is optional. */ }
    }

    function renderGardenPalette() {
      wordList.replaceChildren(...gardenWords.map((word) => {
        const item = document.createElement('li');
        item.draggable = true;
        item.append(word);
        const remove = document.createElement('button');
        remove.className = 'word-palette__remove';
        remove.type = 'button';
        remove.setAttribute('aria-label', `Delete ${word}`);
        remove.textContent = '×';
        remove.addEventListener('click', () => {
          if (gardenWords.length === 1) return;
          gardenWords = gardenWords.filter((candidate) => candidate !== word);
          removeWordFromPrompt(word);
          saveGardenWords();
          renderGardenPalette();
          syncGardenWords();
        });
        item.addEventListener('dragstart', (event) => {
          draggedGardenItem = item;
          item.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', word);
        });
        item.addEventListener('dragend', () => {
          item.classList.remove('is-dragging');
          draggedGardenItem = null;
          gardenWords = [...wordList.querySelectorAll('li')].map((node) => node.firstChild.textContent);
          saveGardenWords();
          syncGardenWords();
        });
        item.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
        });
        item.addEventListener('drop', (event) => {
          event.preventDefault();
          const dragged = draggedGardenItem || wordList.querySelector('.is-dragging');
          if (!dragged || dragged === item) return;
          const items = [...wordList.querySelectorAll('li')];
          const fromIndex = items.indexOf(dragged);
          const toIndex = items.indexOf(item);
          if (fromIndex < 0 || toIndex < 0) return;
          [items[fromIndex], items[toIndex]] = [items[toIndex], items[fromIndex]];
          wordList.replaceChildren(...items);
        });
        item.append(remove);
        return item;
      }));
    }

    clearGardenButton.addEventListener('click', () => {
      const defaultWordSet = new Set(defaultGardenWords);
      gardenWords.filter((word) => !defaultWordSet.has(word)).forEach(removeWordFromPrompt);
      gardenWords = [...defaultGardenWords];
      saveGardenWords();
      renderGardenPalette();
      syncGardenWords();
    });

    try {
      const savedWords = JSON.parse(localStorage.getItem('garden-words') || 'null');
      if (Array.isArray(savedWords) && savedWords.length) gardenWords = savedWords.slice(0, 52);
    } catch { /* Use defaults if storage is unavailable. */ }

    syncGardenWords();
    renderGardenPalette();
    saveGardenWords();
    window.addEventListener('storage', () => {
      gardenWords = getGardenWords();
      syncGardenWords();
      renderGardenPalette();
      renderGardenBeats();
    });

    function renderRunningTitle(word) {
      runningWordTitle.replaceChildren(...[...word].map((character, index) => {
        const characterElement = document.createElement('span');
        characterElement.textContent = character;
        characterElement.style.color = titleColors[index % titleColors.length];
        characterElement.style.transform = `rotate(${Math.round(Math.random() * 20 - 10)}deg)`;
        characterElement.style.marginInline = `${Math.round(Math.random() * 5)}px`;
        return characterElement;
      }));
      runningWordTitle.setAttribute('aria-label', word);
    }

    if (treadmillWords[1]) {
      renderRunningTitle(treadmillWords[1].textContent);
    }

    function updateRunningWordTitle() {
      const trackCenter = treadmillTrack.getBoundingClientRect().left + treadmillTrack.offsetWidth / 2;

      treadmillWords.forEach((word) => {
        const wordCenter = word.getBoundingClientRect().left + word.offsetWidth / 2;
        const previousCenter = previousWordCenters.get(word);

        if (previousCenter !== undefined && previousCenter < trackCenter && wordCenter >= trackCenter) {
          renderRunningTitle(word.textContent);
        }

        previousWordCenters.set(word, wordCenter);
      });

      requestAnimationFrame(updateRunningWordTitle);
    }

    requestAnimationFrame(updateRunningWordTitle);

    input.addEventListener('keydown', (event) => {
      if (event.key !== ' ') return;
      if (input.value.includes('|')) return;
      const wordsInInput = input.value.trim().split(/\s+/).filter(Boolean);
      if (wordsInInput.length < 3) return;
      event.preventDefault();
      form.requestSubmit();
    });

    input.addEventListener('input', saveSpeakInput);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      saveSpeakInput();
      const query = input.value.trim();
      if (query) addSearchWordsToGarden(query);
      input.value = '';
      saveSpeakInput();
      result.textContent = query ? `You searched for “${query}”` : 'Type something to search.';
    });
  </script>
</body>
</html>
