name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profile definitions
        run: node scripts/validate-profiles.js
      - name: Run unit tests
        run: npm test
      - name: Syntax and schema checks
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python evaluations
        run: python -m unittest discover -s evals -p 'test_*.py'
