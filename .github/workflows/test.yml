name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agentcore-harness:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AgentCore test dependencies
        run: pip install -r requirements.txt
      - name: Test Python runtime harness without model calls
        run: python -m unittest discover -s tests -p test_agentcore_harness.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profile definitions
        run: node scripts/validate-profiles.js
      - name: Run unit tests
        run: npm test
      - name: Syntax and schema checks
        run: npm run check
